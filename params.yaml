DataPreprocessing:
  test_size: 0.20
  random_state: 42
  word_ngram_range: [1, 2]
  word_max_features: 50000
  word_min_df: 2
  char_ngram_range: [3, 5]
  char_max_features: 60000
  char_min_df: 2

ModelTraining:
  solver: "saga"
  C: 0.5
  max_iter: 1
  n_jobs: 1
  verbose: 1

BiLSTMTraining:
  max_seq_len: 100
  embedding_dim: 50
  lstm_units: 64
  dropout: 0.3
  spatial_dropout: 0.2
  batch_size: 512
  epochs: 3
  learning_rate: 0.001