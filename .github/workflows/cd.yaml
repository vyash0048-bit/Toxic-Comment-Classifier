name: CD to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            # Clone the repository if it doesn't exist yet
            if [ ! -d "$HOME/Toxic-Comment-Classifier" ]; then
              git clone https://github.com/vyash0048-bit/Toxic-Comment-Classifier.git $HOME/Toxic-Comment-Classifier
            fi
            
            cd ~/Toxic-Comment-Classifier
            git pull origin main
            
            # Stop any running instance using saved PID file
            if [ -f app.pid ]; then
              kill $(cat app.pid) 2>/dev/null || true
              rm -f app.pid
            fi
            
            # Install Python 3.12 (TensorFlow doesn't support 3.14 yet)
            if ! command -v python3.12 &> /dev/null; then
              sudo add-apt-repository -y ppa:deadsnakes/ppa > /dev/null 2>&1
              sudo apt-get update -qq
              sudo apt-get install -y -qq python3.12 python3.12-venv python3.12-dev > /dev/null
            fi
            
            # Set up virtual environment with Python 3.12
            python3.12 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install --no-cache-dir -r requirements-deploy.txt
            
            # Start the Flask app in the background on port 5000 (properly detached)
            export PORT=5000
            nohup python flask_app.py > app.log 2>&1 < /dev/null &
            echo $! > app.pid
