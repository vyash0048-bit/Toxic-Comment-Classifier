name: CD to AWS EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            # Clone the repository if it doesn't exist yet
            if [ ! -d "$HOME/Toxic-Comment-Classifier" ]; then
              git clone https://github.com/vyash0048-bit/Toxic-Comment-Classifier.git $HOME/Toxic-Comment-Classifier
            fi
            
            cd ~/Toxic-Comment-Classifier
            
            git pull origin main
            
            # Install uv if not present (manages Python versions automatically)
            if ! command -v uv &> /dev/null; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi
            
            # Install DVC globally using uv
            uv tool install dvc
            export PATH="$HOME/.local/bin:$PATH"
            
            # Pull model files from DagsHub using DVC
            export DAGSHUB_USER_TOKEN="cf91bd3261b036597f4bf09e72ec56ec5d602008"
            dvc remote modify origin --local auth basic
            dvc remote modify origin --local user vyash0048
            dvc remote modify origin --local password $DAGSHUB_USER_TOKEN
            dvc pull -r origin
            
            # Verify model files
            echo "--- FILE SIZES ---"
            du -h artifacts/bilstm_training/bilstm_model.keras || true
            du -h artifacts/model_training/model.joblib || true
            echo "-----------------"
            
            # Stop any running instance
            sudo systemctl stop toxic-app 2>/dev/null || true
            
            # Free up disk space
            sudo docker system prune -a -f 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true
            sudo rm -rf /var/cache/apt/archives/* 2>/dev/null || true
            rm -rf venv 2>/dev/null || true
            df -h /
            
            # Install uv if not present (manages Python versions automatically)
            if ! command -v uv &> /dev/null; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi
            
            # Set up virtual environment with Python 3.12 via uv
            rm -rf venv
            uv venv --python 3.12 venv
            source venv/bin/activate
            python --version
            uv pip install -r requirements-deploy.txt
            
            # Create systemd service for auto-start on boot
            sudo tee /etc/systemd/system/toxic-app.service > /dev/null <<EOF
            [Unit]
            Description=Toxic Comment Classifier Flask App
            After=network.target
            
            [Service]
            User=$(whoami)
            WorkingDirectory=$HOME/Toxic-Comment-Classifier
            ExecStart=$HOME/Toxic-Comment-Classifier/venv/bin/python $HOME/Toxic-Comment-Classifier/flask_app.py
            Environment=PORT=5000
            Restart=always
            RestartSec=5
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # Enable and start the service
            sudo systemctl daemon-reload
            sudo systemctl enable toxic-app
            sudo systemctl restart toxic-app
            sudo systemctl status toxic-app --no-pager
