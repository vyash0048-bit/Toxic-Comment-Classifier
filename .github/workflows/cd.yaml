name: CD to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
          
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Toxic-Comment-Classifier
            git pull origin main
            
            # Stop the old container (don't fail if it doesn't exist yet)
            sudo docker stop toxic-app || true
            sudo docker rm toxic-app || true

            # Build the new image
            sudo docker build -t toxic-app .
                
            # Run the new container (maps port 80 on EC2 to 5000 in the container)
            sudo docker run -d --name toxic-app -p 80:5000 toxic-app
